[package]
name = "cielarvis-desktop"
version = "0.1.0"
description = "Windows desktop shell for the Cielarvis visual agent"
authors = ["One Ciel LLC"]
license = "MIT"
edition = "2024"

[lib]
name = "cielarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
embed-resource = "3.0.11"
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
axum = "0.8.9"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1.2", features = ["transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tauri = { version = "2.11.5", features = ["unstable"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"
