[package]
name = "cielarvis-desktop"
version = "0.1.0"
description = "Windows desktop shell for the Cielarvis visual agent"
authors = ["One Ciel LLC"]
license = "MIT"
edition = "2024"

[lib]
name = "cielarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
