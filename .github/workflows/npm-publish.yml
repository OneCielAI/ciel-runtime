name: Publish to npm

on:
  push:
    branches: [main, nightly, beta]
  # Manual publish for the branch's tip; it runs the same release gates.
  workflow_dispatch:

jobs:
  quality:
    if: github.ref_name != 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip "ruff==0.15.22" pillow
      - run: python -m compileall -q ciel_runtime.py ciel_runtime_support ciel-runtime-menu.py ciel-runtime-tool-guard.py scripts
      - run: python -m ruff check .
      - run: npm run check:docs
      - run: npm pack --dry-run

  test:
    if: github.ref_name != 'beta'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
            shard: 1/3
          - group: unit
            shard: 2/3
          - group: unit
            shard: 3/3
          - group: unit-real-backend
            shard: ""
          - group: router
            shard: ""
          - group: channel
            shard: ""
          - group: runtime
            shard: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest==9.1.1"
      - name: Run test group
        shell: bash
        run: |
          if [[ "${{ matrix.group }}" == "unit-real-backend" ]]; then
            python scripts/run_test_group.py unit --only test_work_mod_real_backend.py
          else
            args=("${{ matrix.group }}")
            if [[ -n "${{ matrix.shard }}" ]]; then args+=(--shard "${{ matrix.shard }}"); fi
            if [[ "${{ matrix.group }}" == "unit" ]]; then args+=(--exclude test_work_mod_real_backend.py); fi
            python scripts/run_test_group.py "${args[@]}"
          fi

  python-minimum:
    if: github.ref_name != 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "pytest==9.1.1"
      - run: python -m compileall -q ciel_runtime.py ciel_runtime_support ciel-runtime-menu.py ciel-runtime-tool-guard.py scripts
      - run: python -c "import ciel_runtime; import ciel_runtime_support.work_mcp_tools; import ciel_runtime_support.work_parallel_mcp"
      - run: python -m unittest -v tests/test_pty_exit_status_race.py
      - run: python scripts/run_test_group.py unit --shard 1/3 --exclude test_work_mod_real_backend.py

  publish:
    # Release gates removed from beta on the user's order (2026-11-18): beta publishes
    # without CI. main and nightly keep every gate.
    needs: [quality, test, python-minimum]
    if: ${{ always() && (github.ref_name == 'beta' || (needs.quality.result == 'success' && needs.test.result == 'success' && needs['python-minimum'].result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@one-ciel-ai"

      - name: Determine publish channel
        id: channel
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          case "${ref}" in
            nightly|beta)
              echo "tag=${ref}" >> "$GITHUB_OUTPUT"
              echo "kind=${ref}" >> "$GITHUB_OUTPUT" ;;
            main)
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              echo "kind=stable" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported publish ref: ${ref}" >&2; exit 1 ;;
          esac
          echo "Channel for ref ${ref}: tag=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -n1)"

      - name: Compute and apply prerelease version
        if: steps.channel.outputs.kind == 'nightly' || steps.channel.outputs.kind == 'beta'
        id: version
        shell: bash
        run: |
          base="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          stamp="$(date -u +%Y%m%d-%H%M%S).${short_sha}"
          kind="${{ steps.channel.outputs.kind }}"
          new="${base}-${kind}.${stamp}"
          echo "Prerelease version: ${new}"
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${new}';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n');"
          sed -i "s/^VERSION = .*/VERSION = \"${new}\"/" ciel_runtime_support/runtime_constants.py

      - id: publish-check
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "Checking ${pkg}@${version}..."
          if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
            echo "Package ${pkg}@${version} is already published; skipping npm publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package ${pkg}@${version} is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public --tag ${{ steps.channel.outputs.tag }}
        if: steps.publish-check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published tarball
        if: steps.publish-check.outputs.should_publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${{ steps.channel.outputs.tag }}"
          max_attempts=90
          echo "Verifying ${pkg}@${version} tarball..."
          for attempt in $(seq 1 "${max_attempts}"); do
            if npm pack "${pkg}@${version}" --dry-run >/tmp/npm-pack-verify.log 2>&1; then
              cat /tmp/npm-pack-verify.log
              exit 0
            fi
            cat /tmp/npm-pack-verify.log
            echo "Tarball is not available yet; retry ${attempt}/${max_attempts}..."
            sleep 10
          done
          if [[ "${tag}" == "nightly" || "${tag}" == "beta" ]]; then
            echo "Published ${tag} tarball is unavailable; restoring only this channel's installable version."
            mapfile -t versions < <(npm view "${pkg}" versions --json | node -e "const fs=require('fs');const cur=process.argv[1],tag=process.argv[2];const versions=JSON.parse(fs.readFileSync(0,'utf8')); for (const v of versions.filter(v => v !== cur && v.includes('-'+tag+'.')).reverse()) console.log(v);" "${version}" "${tag}")
            for previous in "${versions[@]}"; do
              if npm pack "${pkg}@${previous}" --dry-run >/tmp/npm-pack-previous.log 2>&1; then
                cat /tmp/npm-pack-previous.log
                npm dist-tag add "${pkg}@${previous}" "${tag}"
                echo "Restored ${tag} to ${previous}."
                break
              fi
            done
          fi
          exit 1
